<!DOCTYPEhtml>
<html>
	<head>
		<title>Color Scheme Assignment</title>
	</head>
	<body>
		<h1>Color Scheme Assignment</h1>
		<img src="DesignatedImage/RacetrackPhoto.jpg" alt="Top down view of red car on racetrack" height="400px"><br/>
		<style>
			table, tr, td{
			border: 3px solid black;
			}
		</style>
		<table>
			<tr>
				<td colspan="4">Racetrack</td>
			</td>
			<tr>
				<td style="background-color:#FF0000; font-weight:bold; font-family:Courier, monospace;">RED</td>
				<td style="background-color:#000000; font-wieght:bold; font-family:Courier, monospace; color:#FFFFFF;">BLACK</td>
				<td style="background-color:#315C15; font-weight:bold; font-family:Courier, monospace; color:#FFFFFF">FOREST GREEN</td>
				<td style="background-color:#F0F0FF; font-weight:bold; font-family:Courier, monospace;">TITAN WHITE</td>
			</tr>
			<tr>
				<td>#FF0000</td>
				<td>#000000</td>
				<td>#315C15</td>
				<td>#F0F0FF</td>
			</tr>
			<tr>
				<td>rgb(255, 0, 0)</td>
				<td>rgb(0,0,0)</td>
				<td>rgb(49,92,21)</td>
				<td>rgb(240, 240, 255)</td>
			</tr>
			<tr>
				<td>hsl(0°,100%,50%)</td>
				<td>hsl(0°,0%,0%)</td>
				<td>hsl(96.3°, 62.8%, 22.2%)</td>
				<td>hsl(240°, 100%, 97%)</td>
			</tr>

		</table>
	</body>
</html>
